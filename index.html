<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BTC Overlay</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Inter, Arial, sans-serif;
    overflow: hidden;
}

/* CONTAINER */
.container {
    position: absolute;
    top: 20px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px; /* jemný spacing */

    opacity: 0;
    transform: translateX(-20px);
    transition: all 1s ease;
}

.container.visible {
    opacity: 1;
    transform: translateX(0);
}

/* BUTTON */
.btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;

    padding: 8px 20px 8px 14px;

    /* ✅ nový orezaný button */
    background-image: url("https://raw.githubusercontent.com/protectorebay/BTCBUTTON2PNG/fe7e4b0ea2e173aba2d8bde4db52814df1c0c4c1/btc-m1-bez-live2.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;

    font-size: 16px;
    font-weight: 800;
    color: white;

    line-height: 1;

    opacity: 0;
    transform: translateX(-20px);
    transition: all 0.8s ease;

    white-space: nowrap;
}

/* DOT */
.btn::before {
    content: "";
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);

    width: 12px;
    height: 12px;
    border-radius: 50%;
}

/* COLORS */
.btn.positive::before {
    background: linear-gradient(135deg, #40e100, #ffd000);
}
.btn.negative::before {
    background: linear-gradient(135deg, #ff3b3b, #ff0000);
}

/* LABEL */
.label-box {
    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,0.45);
    border-radius: 6px;
    padding: 2px 7px;

    font-size: 12px;
    font-weight: 700;
}

/* VALUE */
.value {
    display: flex;
    align-items: center;

    font-size: 18px;
    font-weight: 900;
}

.green { color: #40e100; }
.red { color: #ff3b3b; }

/* SHOW */
.btn.show {
    opacity: 1;
    transform: translateX(0);
}

/* HIDE */
.btn.hide {
    opacity: 0;
    transform: translateX(-140px);
    transition: all 2.5s cubic-bezier(0.22, 1, 0.36, 1);
}
</style>
</head>

<body>

<div class="container" id="container">
    <div class="btn" id="b1"></div>
    <div class="btn" id="b2"></div>
    <div class="btn" id="b3"></div>
    <div class="btn" id="b4"></div>
    <div class="btn" id="b5"></div>
    <div class="btn" id="b6"></div>
    <div class="btn" id="b7"></div>
</div>

<script>
const container = document.getElementById("container");
const buttons = [b1,b2,b3,b4,b5,b6,b7];

const periods = [
    {h:6,label:"6H"},
    {h:12,label:"12H"},
    {h:24,label:"24H"},
    {h:48,label:"48H"},
    {h:72,label:"72H"},
    {h:168,label:"1W"},
    {h:720,label:"1M"},
];

// --- FETCH ---
async function fetchData() {
    const [p,k] = await Promise.all([
        fetch("https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT"),
        fetch("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1h&limit=720")
    ]);

    return {
        current: parseFloat((await p.json()).price),
        klines: await k.json()
    };
}

// --- UPDATE ---
async function updateData() {
    const d = await fetchData();
    let maxWidth = 0;

    for (let i=0;i<periods.length;i++){
        const p = periods[i];
        const past = parseFloat(d.klines[d.klines.length - p.h][4]);
        const change = ((d.current - past)/past)*100;
        const pos = change>=0;

        buttons[i].className = "btn " + (pos?"positive":"negative");

        buttons[i].innerHTML = `
            <div class="label-box">${p.label}</div>
            <div class="value ${pos?'green':'red'}">
                ${pos?'+':''}${change.toFixed(2)}%
            </div>`;
    }

    buttons.forEach(b=>b.style.width="auto");
    buttons.forEach(b=>maxWidth=Math.max(maxWidth,b.offsetWidth));
    buttons.forEach(b=>b.style.width=maxWidth+"px");
}

// --- SHOW ---
function showSequence(){
    container.classList.add("visible");
    buttons.forEach((b,i)=>setTimeout(()=>b.classList.add("show"),i*150));
}

// --- HIDE ---
function hideSequence(){
    [...buttons].reverse().forEach((b,i)=>setTimeout(()=>b.classList.add("hide"),i*180));
    setTimeout(()=>{
        container.classList.remove("visible");
        buttons.forEach(b=>b.classList.remove("show","hide"));
    },2600);
}

// --- LOOP ---
async function loop(){
    while(true){
        await updateData();
        showSequence();
        await sleep(30000);
        hideSequence();
        await sleep(90000);
    }
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

loop();
</script>

</body>
</html>
